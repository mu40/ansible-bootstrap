---
name: Test setup

"on":
  workflow_dispatch: {}
  pull_request:
    paths:
      - setup.sh
      - .github/workflows/test-setup.yaml
  push:
    paths:
      - setup.sh
      - .github/workflows/test-setup.yaml

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - name: Check-out repository
        uses: actions/checkout@v6
      - name: Run script
        run: sh -x setup.sh
