---
name: Validate YAML files

"on":
  workflow_dispatch: {}
  pull_request: {}
  push:
    paths:
      - '**/*.yaml'
      - '**/*.yml'

jobs:
  setup:
    name: Lint YAML files
    runs-on: ubuntu-latest
    steps:
      - name: Check-out repository
        uses: actions/checkout@v4
      - name: Run linter
        run: yamllint -s .
